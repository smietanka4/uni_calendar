# Strefy rate limiting (muszą być w kontekście http{})
# Osobny plik ładowany jako pierwszy, przed default.conf

# Ogólne API – 30 req/s na IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Endpointy auth – max 5 req/s (ochrona brute force)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
