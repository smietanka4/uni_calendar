name: CI/CD – Uni Calendar

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # JOB 1: Testy i walidacja backendu (Spring Boot)
  # ──────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend – Build & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uni_calendar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend-spring

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test (Maven)
        env:
          POSTGRES_DB: uni_calendar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-key-minimum-64-characters-for-hmac-sha256-signing
        run: ./mvnw verify -B

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2: Build frontendu (Node.js / Vite)
  # ──────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend – Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zainstaluj zależności npm
        run: npm ci

      - name: Zbuduj produkcyjny bundle (Vite)
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────
  # JOB 3: Build obrazów Docker (tylko po merge do main)
  # ──────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker – Build Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Zbuduj obraz backendu
        uses: docker/build-push-action@v5
        with:
          context: ./backend-spring
          push: false   # Zmień na true i skonfiguruj registry dla CD
          tags: uni-calendar/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zbuduj obraz frontendu
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: uni-calendar/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
